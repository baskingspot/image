# The image guide, served at baskingspot.dev/image/. The theme and the site
# build come from baskingspot-docs; the router in baskingspot/site serves
# /image/...
base_url = "https://baskingspot.dev/image"
theme = "baskingspot"
title = "image"
description = "Image decoders and encoders in Zig with no C: PNG, JPEG, GIF, WebP, TIFF, JPEG XL, and more."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/image"
api = true
third_party = true
