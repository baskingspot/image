# The jobs baskingspot/gh-actions' ci.yml runs, in parallel: with the
# oracle comparison, which .github/workflows/ci.yml runs itself so that a
# mismatch's inputs are uploaded, they are `just ci`. Fuzzing runs on a
# schedule instead (.github/workflows/fuzz.yml).
jobs:
  - recipe: test
  - recipe: test-cpu
  - recipe: test-be
  - recipe: lint
  - recipe: doc
